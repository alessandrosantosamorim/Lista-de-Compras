<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  
  <!-- controlar a escala da página. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Lista de Compras do Supermercado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h2>Mercado da lenda</h2>

    <form id="formProduto">
      <div class="campo">
        <label for="nome">Produto:</label>
        <input type="text" id="nome" placeholder="ex: acucar, sal, manteiga" required>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="quantidade">Quantidade:</label>
          <input type="number" id="quantidade" placeholder=" ex: 5 " min="1" required>
        </div>

        <div class="campo">
          <label for="preco">Preço (R$):</label>
          <input type="number" id="preco" placeholder="R$: 10,00 reais" step="0.01" min="0" required>
        </div>
      </div>

      <button type="submit">Adicionar</button>
    </form>

    <h3>itens na mão:</h3>
    <ul id="listaCompras"></ul>

    <!-- ELEMENTO NOVO PARA EXIBIR O TOTAL -->
    <div class="total-container">
      <button onclick="comprar()">Comprar</button>

      <p id="mensagem"></p>
      <strong>Valor a pagar: R$ <span id="valorTotal">0.00</span></strong>
    </div>
  
  </main>

  <script src="script.js"></script>
</body>
</html>
